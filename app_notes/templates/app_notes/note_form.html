{% extends "base.html" %}

{% block title %}
    {% if object %}Редактировать запись{% else %}Новая запись{% endif %} — Sky Note
{% endblock %}

{% block content %}
    <h1 class="mb-4">
        {% if object %}Редактировать запись{% else %}Новая запись{% endif %}
    </h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Сохранить</button>
                <a class="btn btn-secondary" href="{% url 'app_notes:note_list' %}">
                    Отмена
                </a>
            </form>
        </div>
    </div>
{% endblock %}
