{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Веб-приложение для ведения личного дневника">
    <meta name="author" content="Alex Bachevskiy">
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <title>{% block title %}Sky Note{% endblock %}</title>
    {% include "includes/style_css.html" %}
</head>
<!-- Липкий подвал через flexbox: страница на всю высоту окна, контент тянется, футер прижимается вниз -->
<body class="d-flex flex-column min-vh-100">
    <!-- Навигация -->
    {% include "includes/navbar.html" %}

    <!-- Основной контент -->
    <main class="flex-grow-1">
        <div class="container py-4">
            <!-- Django messages -->
            {% include "includes/messages.html" %}

            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Подвал -->
    {% include "includes/footer.html" %}

    <!-- JS -->
    {% include "includes/style_js.html" %}
</body>
</html>
